name: manual_ganadero_flutter
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Dependencias de Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_auth: ^5.5.3
  firebase_storage: ^12.1.1 # Añadida: Para subir y descargar archivos de Firebase Storage
  google_sign_in: ^6.2.1

  # Dependencias para la funcionalidad de IA
  image_picker: ^1.1.0 # Añadida: Para seleccionar imágenes de la galería o cámara
  tflite_flutter: ^0.11.0 # Añadida: Para ejecutar modelos TensorFlow Lite
  image: ^4.2.0 # Añadida: Para manipular (redimensionar) imágenes antes del análisis
  path_provider: ^2.1.3 # Añadida: Útil para manejar rutas de archivos temporales

  # Otras dependencias que ya tenías
  fl_chart: ^1.0.0
  font_awesome_flutter: ^10.7.0
  intl: ^0.20.2
  flutter_svg: ^2.0.9
  table_calendar: ^3.1.1
  collection: ^1.18.0
  carousel_slider: ^5.0.0
  uuid: ^4.0.0
  file_picker: ^10.3.10
  excel: ^4.0.6
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Asegúrate de que esta sección incluya la carpeta donde está tu modelo de IA
  assets:
    - assets/
    - assets/models/
